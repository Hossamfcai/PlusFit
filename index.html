<!doctype html>

  <head>

    <link rel="stylesheet" href="./CSS/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-primary: #69f8f1;
        --color-primary-100: #00201F;
        --color-secondary: #1a1a1a;
        --color-Teratiary: #ffffff;
        --color-Teratiary-100: #1A1C1C;
         --color-Teratiary-800: #C8C6C5;
        --color-Teratiary-900: #E2E2E2;
        --color-neutral: #000000;
        --font-headline: "Montserrat", sans-serif; 
        --font-body: "Inter", sans-serif; 
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"

  <body class="bg-neutral font-body">
    <nav class="flex w-full justify-between md:justify-around items-center px-5 lg:px-18 py-4 border border-b-Teratiary-100">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8">
          <img class="w-full" src="./assets/images/plusfit_logo.png" alt="" />
        </div>
        <h3 class="font-headline text-Teratiary text-2xl font-bold text-primary tracking-tighter">PlusFit</h1>
      </div>
      <ul class="hidden md:flex">
        <li class="mx-4"><a href="" class=" text-Teratiary-800 text-md font-semibold py-1 px-3 hover:text-primary hover:bg-primary-100 rounded-sm transition-all duration-300">Features</a></li>
        <li class="mx-4"><a href="" class=" text-Teratiary-800 text-md font-semibold py-1 px-3 hover:text-primary hover:bg-primary-100 rounded-sm transition-all duration-300">About</a></li>
        <li class="mx-4"><a href="" class=" text-Teratiary-800 text-md font-semibold py-1 px-3 hover:text-primary hover:bg-primary-100 rounded-sm transition-all duration-300">Pricing</a></li>
        <li class="mx-4"><a href="" class=" text-Teratiary-800 text-md font-semibold py-1 px-3 hover:text-primary hover:bg-primary-100 rounded-sm transition-all duration-300">Contact</a></li>
      </ul>
      <a class="bg-primary px-4 sm:px-7 py-2 font-bold fon-headline rounded-xs cursor-pointer hover:scale-105 transition-transform duration-300 drop-shadow-lg">Buy Now</a>
    </nav>

    <section class="w-full min-h-[90dvh] my-5 px-2 py-5 md:p-5 grid grid-col-1 md:gap-5 md:grid-cols-2">
      <div class="flex justify-end">
          <div class="max-w-160 flex flex-col  gap-8 justify-center ">
          <h1 class="bg-gradient-to-r from-Teratiary to-primary bg-clip-text text-transparent text-[2.5rem] leading-none md:text-6xl font-bold font-headline">Peak Performance on Your Wrist</h1>
          <p class="text-Teratiary-800 font-body">Track heart rate, sleep, and daily activity with precision. Syncs instantly with the PlusFit app to keep you in the zone.</p>
          <div class="flex gap-3">
            <a href="" class="bg-primary px-5 py-2 sm:px-7 sm:py-3 font-bold fon-headline rounded-xs cursor-pointer hover:scale-105 transition-transform duration-300 drop-shadow-lg">BUY NOW</a>
            <a href="" class="bg-transparent px-5 py-2 sm:px-7 sm:py-3 text-Teratiary border border-Teratiary-800 font-bold fon-headline rounded-xs cursor-pointer hover:scale-105 transition-transform duration-300 drop-shadow-lg">EXPLORE</a>
          </div>
        </div>
      </div>
      
      
        <div class="flex justify-center items-center  pt-18 sm:pt-0 px-10 sm:px-0 truncate z-20">
          <div class="flex relative max-w-[500px]  aspect-square rounded-full flex items-center justify-center ">
              <div class="w-full absolute inset-0 border border-primary/20 rounded-lg animate-[spin_20s_linear_infinite]"></div>
              <div class="w-full absolute inset-4 border border-primary/20 rounded-lg animate-[spin_15s_linear_infinite_reverse]"></div>
              <img class="w-full h-full object-contain relative z-20 drop-shadow-2xl" src="./assets/images/hero-image.png" alt="">
          </div>
        </div>
    </section>

    <script src="./Js/script.js"></script>
